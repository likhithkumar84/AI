name: CI

# CI runs only when a PR is merged into main (a merge is a push to main).
# It intentionally does NOT run on PR open/update or feature-branch pushes.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
